<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <!-- creating css inside the html not in line-->
    <style type="text/css">
        *{
            text-decoration: none;
         }
        .nav_bar{
            background: crimson; 
            font-family: 'Times New Roman', Times, serif; padding-right: 15px;
            padding-left: 15px;
        }
        .nav_div{
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo a{ 
            font-size: 35px; font-weight: 600; color: white;
        }
        li{
            list-style: none;  display: inline-block;
        }
        li a{
            color: white; font-size: 18px; font-weight: bold; margin-right: 25px;
        }
        button{ background-color: black; margin-left: 10px; border-radius: 10px;
            padding: 10px; width: 90px;
        }
        button a{
            color: white; font-weight: bold; font-size: 15px;
        }
    </style>
</head>
<body>
    <nav class="nav_bar">
        <div class="nav_div">
            <div class="logo"><a href="#">Return to main page</a></div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <button><a href="#">SignIn</a></button>
                <button><a href="#">SignUp</a></button>
            </ul>

        </div>

    </nav>
    
</body>
</html>
